# Benchmark harness settings for Histrel.
#
# Read by ``benchmark.predict`` (predictor defaults) and by the agent wrappers
# (model id and token budgets). The agent's own configuration lives in the
# repository-root ``histrel.toml``, which the harness templates per instance.

[histrel]
# models: model id, or a table mapping template name -> model id with an
# optional "default" entry.
models = "accounts/fireworks/models/glm-5p3-flash"
# token_budget: total budget for the entire run (prompt + completion).
# token_budget_buffer: portion reserved for finalization.
token_budget = 3_000_000
token_budget_buffer = 25_000

[benchmark]
output_dir = "benchmark/results"
run_name = "bench-local"
seed = 12321

[benchmark.swe_bench]
enabled = true
split = "test"
dataset_id = "princeton-nlp/SWE-bench_Verified"
max_instances = 5
timeout_seconds = 7200
docker = true
docker_base_image = "python:3.11-slim"
tools = ["ripgrep", "fd", "tokei"]

[benchmark.verbose]
enabled = false
