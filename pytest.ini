[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = tests
pythonpath = src
addopts = --xdoctest --ignore=vendor --ignore=benchmark/vendor
filterwarnings =
    ignore:pkg_resources is deprecated as an API:UserWarning
    ignore:Deprecated call to `pkg_resources.declare_namespace\(':DeprecationWarning
    ignore:Cannot parse module=.*probe_file_pkg.*:UserWarning
    ignore:builtin type SwigPyPacked has no __module__ attribute:DeprecationWarning
    ignore:builtin type SwigPyObject has no __module__ attribute:DeprecationWarning
    ignore:builtin type swigvarlink has no __module__ attribute:DeprecationWarning
    ignore:Support for class-based `config` is deprecated:pydantic.warnings.PydanticDeprecatedSince20
    # TODO: Remove this filter once Tavily QnA tool is removed (qna_search deprecated)
    ignore:qna_search is deprecated:DeprecationWarning
markers =
    unit: Unit tests
    integration: Integration tests
    property: Property-based tests
    performance: Performance tests
    slow_test: Tests that take a long time to run
    requires_live_llm: Tests that make real LLM API calls
